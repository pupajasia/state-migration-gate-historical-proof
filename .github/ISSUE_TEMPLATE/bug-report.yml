name: Bug report
description: Report a reproducible defect using synthetic, non-confidential data.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private artifacts, customer data or vulnerability details.
  - type: input
    id: version
    attributes:
      label: Action tag or commit
      placeholder: v1.0.0 or full commit SHA
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Windows runner image
      placeholder: windows-latest
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic paths and redact anything sensitive.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
