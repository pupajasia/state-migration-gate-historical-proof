name: Beekeeper historical state-gate proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-proof:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install adapter dependency without package scripts
        working-directory: adapters/beekeeper
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund

      - name: Resolve immutable v5.8.1 artifact
        shell: pwsh
        run: |
          python .\github_release_artifact.py `
            --repo beekeeper-studio/beekeeper-studio `
            --release v5.8.1 `
            --name Beekeeper-Studio-5.8.1-portable.exe `
            --sha256 b3d4291008604519e29b7405557029f30ed49b0eaf0b53e8f9df7ffde9eaf92e `
            --download `
            --output .state-gate-artifacts\v5.8.1 `
            --receipt release-receipts\v5.8.1.json

      - name: Resolve immutable v5.9.0 artifact
        shell: pwsh
        run: |
          python .\github_release_artifact.py `
            --repo beekeeper-studio/beekeeper-studio `
            --release v5.9.0 `
            --name Beekeeper-Studio-5.9.0-portable.exe `
            --sha256 541dde78e10544ac60c9ab21a18f2ff5f8bfc6b85a6195bd1584d0f503823240 `
            --download `
            --output .state-gate-artifacts\v5.9.0 `
            --receipt release-receipts\v5.9.0.json

      - name: Confirm the pre-fix same-version control is blocked
        shell: pwsh
        run: |
          $oldArtifact = (Resolve-Path -LiteralPath '.state-gate-artifacts\v5.8.1\Beekeeper-Studio-5.8.1-portable.exe').Path
          python .\state_gate.py `
            --config .\adapters\beekeeper\state-gate.beekeeper.example.json `
            --output .\historical-evidence\control `
            --var "previous_artifact=$oldArtifact" `
            --var "candidate_artifact=$oldArtifact"
          $gateExit = $LASTEXITCODE
          if ($gateExit -ne 1) {
            throw "Expected semantic block (exit 1), received $gateExit"
          }
          $reports = @(Get-ChildItem -LiteralPath '.\historical-evidence\control' -Filter report.json -File -Recurse)
          if ($reports.Count -ne 1) {
            throw "Expected exactly one control report, found $($reports.Count)"
          }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          $attempt = $report.paths[0].attempts[0]
          $seedEdits = @($attempt.seed_evidence.database.linked_tabs | Where-Object {
            $_.unsavedChanges -eq 1 -and $_.unsavedQueryText -eq 'select 999 as retained_state_gate_edit;'
          })
          $comparison = $attempt.verify_evidence.semantic_comparison.checks
          $controlChecks = [ordered]@{
            overall_failed = $report.verdict -eq 'fail'
            seed_was_clean = $attempt.seed.passed -and -not $attempt.seed.timed_out -and $null -eq $attempt.seed.launch_error
            edited_state_was_seeded = $seedEdits.Count -eq 1
            verify_was_clean = $attempt.verify.exit_code -eq 1 -and -not $attempt.verify.timed_out -and $null -eq $attempt.verify.launch_error
            evidence_was_readable = $null -eq $attempt.evidence_error
            edited_text_disappeared_from_ui = -not $attempt.verify_evidence.ui.restored_edit_visible
            saved_text_replaced_the_edit_in_ui = -not $attempt.verify_evidence.ui.original_text_not_substituted
            database_remained_readable = $comparison.database_integrity
            saved_query_survived = $comparison.saved_query_identity -and $comparison.saved_query_meaning
            edited_tab_meaning_was_lost = -not $comparison.edited_tab_meaning
          }
          $failedChecks = @($controlChecks.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object Key)
          if ($failedChecks.Count -gt 0) {
            throw "Control did not demonstrate the expected historical state loss: $($failedChecks -join ', ')"
          }
          Write-Host 'Historical v5.8.1 control produced the expected semantic block.'
          exit 0

      - name: Confirm v5.8.1 to v5.9.0 preserves the edited query
        shell: pwsh
        run: |
          $oldArtifact = (Resolve-Path -LiteralPath '.state-gate-artifacts\v5.8.1\Beekeeper-Studio-5.8.1-portable.exe').Path
          $fixedArtifact = (Resolve-Path -LiteralPath '.state-gate-artifacts\v5.9.0\Beekeeper-Studio-5.9.0-portable.exe').Path
          python .\state_gate.py `
            --config .\adapters\beekeeper\state-gate.beekeeper.example.json `
            --output .\historical-evidence\fixed `
            --var "previous_artifact=$oldArtifact" `
            --var "candidate_artifact=$fixedArtifact"

      - name: Retain receipts, logs, JSON witnesses and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beekeeper-historical-state-gate-evidence
          path: |
            release-receipts/*.json
            historical-evidence/**
            !historical-evidence/**/user-data/portable-application/Beekeeper-Studio.exe
            !historical-evidence/**/user-data/portable-application/beekeeper_studio_data/plugins/**
          if-no-files-found: error
          retention-days: 14
